[package]
name = "moco"
version = "0.1.1"
description = "A private local-first AI desktop agent"
authors = ["Moco contributors"]
edition = "2024"

[lib]
name = "moco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
lopdf = "0.38"
parking_lot = "0.12"
quick-xml = "0.38"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.38"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "sync", "io-util", "fs"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
zip = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_Foundation"] }
